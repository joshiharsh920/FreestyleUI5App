# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: joshi.project1trial

type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: onPremService
          url: http://ibssapserv52.ap-south-1.compute.amazonaws.com:8010
          client: '410'
        app:
          name: ZCUSTOMERAPP
          description: Customer Application
          package: $TMP
          transport: ''
        exclude:
          - /test/
          - /localService/
